name: ParthS
options:
  bundleIdPrefix: com.parthsharma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ParthS:
    type: application
    platform: iOS
    sources:
      - path: ParthS
    info:
      path: ParthS/Info.plist
      properties:
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "Face ID confirms it's you before showing your trading dashboard."
        NSAppTransportSecurity:
          NSExceptionDomains:
            # Scoped to the Tailscale hostname only — see DashboardWebView.swift
            # for why this is plain http:// (Tailscale's own WireGuard tunnel is
            # the real encryption layer) and why this is NOT a blanket ATS bypass.
            parths-mac.tailnet.ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parthsharma.ParthS
        DEVELOPMENT_TEAM: ""   # fill in once you have an Apple Developer team selected in Xcode
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
