name: ParthS
options:
  bundleIdPrefix: com.parthsharma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ParthS:
    type: application
    platform: iOS
    sources:
      - path: ParthS
    # THIS is the source of truth for Info.plist — xcodegen rewrites
    # ParthS/Info.plist from this block on every `xcodegen generate`.
    # Editing that file by hand does not survive. (It briefly looked like
    # the file was authoritative, because the generated output happened to
    # be byte-identical to it; deleting this block proved otherwise by
    # silently dropping NSFaceIDUsageDescription, which crashes the app on
    # its first Face ID call.)
    info:
      path: ParthS/Info.plist
      properties:
        # Empty dict = plain system launch screen. Without any launch
        # screen the app runs letterboxed instead of filling the display.
        UILaunchScreen: {}
        # REQUIRED: iOS terminates the app on its first LocalAuthentication
        # call if this is absent. Shown verbatim in the Face ID prompt.
        NSFaceIDUsageDescription: "Face ID confirms it's you before showing your trading dashboard."
        # The device build speaks ordinary HTTPS — Tailscale Serve terminates
        # TLS with a real cert for the *.ts.net hostname — so there is no
        # blanket ATS exception here. NSAllowsLocalNetworking only permits
        # loopback/local-network addresses, which is exactly what the
        # Simulator build needs to reach http://localhost:8000 (see
        # DashboardWebView.swift). It grants nothing for the public internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parthsharma.ParthS
        DEVELOPMENT_TEAM: ""   # fill in once you have an Apple Developer team selected in Xcode
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
